{% extends 'base.html' %}
{% load static %}
{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-12 col-sm-9 col-md-6 col-lg-4">
        <div class="card shadow-sm mt-4">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <img src="{% static 'img/logo.svg' %}" alt="Logotipo Ás Terraplanagem" width="72" height="72">
                    <h1 class="mt-3 mb-0">Ás Terraplanagem</h1>
                    <p class="text-muted">Gestão Operacional</p>
                </div>

                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ proximo }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuário</label>
                        <input type="text" class="form-control" id="username" name="username" required autofocus autocomplete="username">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primario w-100 py-2">Entrar</button>
                </form>
            </div>
        </div>
        <p class="text-center small mt-3"><a href="{% url 'sobre' %}">Sobre o sistema</a></p>
    </div>
</div>
{% endblock %}
