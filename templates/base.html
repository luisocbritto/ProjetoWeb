{% load static %}<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ás Terraplanagem</title>
    <link rel="icon" href="{% static 'img/logo.svg' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/estilo.css' %}" rel="stylesheet">
</head>
<body>

<!-- Menu: os links só aparecem para quem está logado -->
<nav class="navbar navbar-dark navbar-sistema">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'relatorio' %}">
            <img src="{% static 'img/logo.svg' %}" alt="" width="36" height="36">
            <strong>Ás Terraplanagem</strong>
        </a>
        {% if user.is_authenticated %}
        <div class="d-flex gap-3 align-items-center">
            <a class="nav-link text-white" href="{% url 'relatorio' %}">Relatório</a>
            <a class="nav-link text-white" href="{% url 'listar_obras' %}">Obras</a>
            <a class="nav-link text-white" href="{% url 'api_docs' %}">API</a>
            <a class="nav-link text-white" href="{% url 'admin:index' %}">Admin</a>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button class="btn btn-sm btn-outline-light">Sair</button>
            </form>
        </div>
        {% endif %}
    </div>
</nav>

<main class="container py-4">
    <!-- Mensagens de sucesso/erro enviadas pelas views (messages) -->
    {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">{{ message }}</div>
    {% endfor %}

    {% block conteudo %}{% endblock %}
</main>

{% block scripts %}{% endblock %}
</body>
</html>
